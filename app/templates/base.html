<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jumia Sentiment Analysis{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="/" class="brand">
                <span class="brand-mark">J</span>
                <span class="brand-text">Jumia<span class="brand-accent">Sense</span></span>
            </a>
            <nav class="nav">
                <a href="/" class="{% block nav_home %}{% endblock %}">Classify</a>
                <a href="/upload" class="{% block nav_upload %}{% endblock %}">Batch Upload</a>
                <a href="/dashboard" class="{% block nav_dash %}{% endblock %}">Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Jumia Sentiment Analysis &mdash; Final Year Project</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
